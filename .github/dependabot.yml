# Weekly pull requests for outdated or vulnerable dependencies; CI must pass before anything is merged.
#
# Major versions are not proposed automatically: moving to Spring Boot 4, Jackson 3 or a newer Java is a migration,
# planned and tested on purpose, not a bot PR. Minor and patch updates are grouped into one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      maven-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The images carry the Java version in their tag (17); a newer Java is a deliberate upgrade
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # The build image (Maven + JDK 17) is pinned on purpose; it never ships in the runtime image
      - dependency-name: "maven"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
