name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Docker is available on the runner, so the Testcontainers tests run against a real PostgreSQL
      - name: Build and run tests
        run: mvn -B verify
      - name: Make sure no test was skipped
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -v 'skipped="0"' || true)
          if [ -n "$skipped" ]; then echo "Some tests were skipped: $skipped"; exit 1; fi
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Start app and database
        run: |
          cp .env.example .env
          docker compose up --build -d
      - name: Wait for the app to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then echo "App is up"; exit 0; fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Check API docs and migrations
        run: |
          curl -fs http://localhost:8080/v3/api-docs | grep -q "SakuPay API"
          # Every migration file in the repo must have been applied successfully
          expected=$(ls src/main/resources/db/migration/V*.sql | wc -l)
          applied=$(docker compose exec -T db psql -U sakupay -d sakupay -tAc \
            "SELECT count(*) FROM flyway_schema_history WHERE success AND version IS NOT NULL")
          echo "migrations: $applied applied, $expected in the repo"
          test "$applied" -eq "$expected"
      - name: Register, log in and call a protected endpoint
        run: |
          base=http://localhost:8080/api/v1
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/me)" = "401"
          curl -fs -X POST $base/auth/register -H 'Content-Type: application/json' \
            -d '{"fullName":"CI User","email":"ci@example.com","phone":"081200001111","password":"CiPassword123"}'
          token=$(curl -fs -X POST $base/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"CiPassword123"}' | jq -r .accessToken)
          curl -fs $base/me -H "Authorization: Bearer $token" | jq -e '.role == "USER"'
          # The bootstrap admin from .env.example exists and can list users
          admin=$(curl -fs -X POST $base/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@sakupay.local","password":"local-admin-password-123"}' | jq -r .accessToken)
          curl -fs "$base/admin/users" -H "Authorization: Bearer $admin" | jq -e '.totalElements >= 2'
          echo "token=$token" >> "$GITHUB_ENV"
          echo "admin=$admin" >> "$GITHUB_ENV"
      - name: Deposit and transfer through the ledger
        run: |
          base=http://localhost:8080/api/v1
          json='Content-Type: application/json'
          curl -fs -X PUT $base/me/pin -H "Authorization: Bearer $token" -H "$json" \
            -d '{"password":"CiPassword123","pin":"246810"}'
          a=$(curl -fs -X POST $base/accounts -H "Authorization: Bearer $token" | jq -r .accountNumber)
          b=$(curl -fs -X POST $base/accounts -H "Authorization: Bearer $token" | jq -r .accountNumber)
          curl -fs -X POST "$base/admin/accounts/$a/deposits" -H "Authorization: Bearer $admin" -H "$json" \
            -H "Idempotency-Key: ci-deposit-1" -d '{"amount":100000}'
          body="{\"sourceAccount\":\"$a\",\"destinationAccount\":\"$b\",\"amount\":40000,\"pin\":\"246810\"}"
          for attempt in 1 2; do   # the retry must not move money again
            curl -fs -X POST $base/transfers -H "Authorization: Bearer $token" -H "$json" \
              -H "Idempotency-Key: ci-transfer-1" -d "$body" | jq -e '.balanceAfter == 60000'
          done
          curl -fs "$base/accounts/$b" -H "Authorization: Bearer $token" | jq -e '.balance == 40000'
          echo "account=$a" >> "$GITHUB_ENV"
      - name: Top up through the signed bank webhook and download statements
        run: |
          set -a; . ./.env; set +a   # TOPUP_WEBHOOK_SECRET, shared with the simulated bank
          base=http://localhost:8080/api/v1
          va=$(curl -fs "$base/accounts/$account" -H "Authorization: Bearer $token" | jq -r .virtualAccount)
          scripts/simulate-topup.sh "$va" 25000 | jq -e '.status == "CREDITED"'
          # The bank retries the same event: credited once
          EVENT_ID=ci-event-0001 scripts/simulate-topup.sh "$va" 1000 | jq -e '.status == "CREDITED"'
          EVENT_ID=ci-event-0001 scripts/simulate-topup.sh "$va" 1000 | jq -e '.status == "DUPLICATE"'
          # Someone without the secret tries to mint money
          TOPUP_WEBHOOK_SECRET=forged-secret-forged-secret-forged-secret \
            scripts/simulate-topup.sh "$va" 999999 | jq -e '.code == "INVALID_SIGNATURE"'
          # 100.000 deposit - 40.000 transfer + 25.000 + 1.000 top-ups
          curl -fs "$base/accounts/$account" -H "Authorization: Bearer $token" | jq -e '.balance == 86000'
          curl -fs "$base/accounts/$account/statement" -H "Authorization: Bearer $token" | jq -e '.totalLines == 4'
          curl -fs "$base/accounts/$account/statement.csv" -H "Authorization: Bearer $token" | grep -q '"TOPUP"'
          curl -fs "$base/accounts/$account/statement.pdf" -H "Authorization: Bearer $token" | head -c 5 | grep -q '%PDF-'
      - name: A large transfer is held and released by an admin
        run: |
          base=http://localhost:8080/api/v1
          json='Content-Type: application/json'
          b=$(curl -fs "$base/accounts" -H "Authorization: Bearer $token" | jq -r '.[1].accountNumber')
          curl -fs -X POST "$base/admin/accounts/$account/deposits" -H "Authorization: Bearer $admin" -H "$json" \
            -H "Idempotency-Key: ci-deposit-2" -d '{"amount":6000000}'
          body="{\"sourceAccount\":\"$account\",\"destinationAccount\":\"$b\",\"amount\":6000000,\"pin\":\"246810\"}"
          ref=$(curl -fs -X POST $base/transfers -H "Authorization: Bearer $token" -H "$json" \
            -H "Idempotency-Key: ci-transfer-large" -d "$body" | jq -er 'select(.status == "ON_HOLD") | .reference')
          alert=$(curl -fs "$base/fraud-alerts?status=OPEN" -H "Authorization: Bearer $admin" \
            | jq -er --arg ref "$ref" '.content[] | select(.transactionReference == $ref) | .id')
          curl -fs -X POST "$base/admin/fraud-alerts/$alert/approve" -H "Authorization: Bearer $admin" -H "$json" \
            -d '{"note":"CI approval"}' | jq -e '.status == "APPROVED"'
          curl -fs "$base/transfers/$ref" -H "Authorization: Bearer $token" | jq -e '.status == "COMPLETED"'
          curl -fs "$base/accounts/$b" -H "Authorization: Bearer $token" | jq -e '.balance == 6040000'
      # The image contains the app jar with every library it ships. Fail on fixable HIGH/CRITICAL library
      # vulnerabilities; OS packages of the base image are reported but do not block.
      # Pinned to a commit, not a tag: this action's tags were hijacked in a supply-chain attack in March 2026.
      - name: Scan the image for vulnerable libraries (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: sakupay-app:local
          vuln-type: library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Report base image vulnerabilities (Trivy, not blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: sakupay-app:local
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          skip-setup-trivy: true
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
