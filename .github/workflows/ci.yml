name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Docker is available on the runner, so the Testcontainers tests run against a real PostgreSQL
      - name: Build and run tests
        run: mvn -B verify
      - name: Make sure no test was skipped
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -v 'skipped="0"' || true)
          if [ -n "$skipped" ]; then echo "Some tests were skipped: $skipped"; exit 1; fi
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start app and database
        run: |
          cp .env.example .env
          docker compose up --build -d
      - name: Wait for the app to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then echo "App is up"; exit 0; fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Check API docs and migrations
        run: |
          curl -fs http://localhost:8080/v3/api-docs | grep -q "SakuPay API"
          docker compose exec -T db psql -U sakupay -d sakupay -tAc \
            "SELECT version FROM flyway_schema_history WHERE success" | grep -qx "1"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
