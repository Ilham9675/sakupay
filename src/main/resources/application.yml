spring:
  application:
    name: sakupay
  # Connection settings come from the environment (see .env.example); the defaults match docker-compose.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sakupay}
    username: ${DB_USERNAME:sakupay}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  paths-to-match: /api/**
