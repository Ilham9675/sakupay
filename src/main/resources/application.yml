spring:
  application:
    name: sakupay
  # Connection settings come from the environment (see .env.example); the defaults match docker-compose.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sakupay}
    username: ${DB_USERNAME:sakupay}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  paths-to-match: /api/**

sakupay:
  # Daily limits reset at midnight in this zone
  business-zone: Asia/Jakarta
  security:
    # Required, at least 32 bytes. Never commit a real value; set JWT_SECRET in the environment / .env
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    bcrypt-strength: 12
    pin-max-attempts: 5
    pin-lock-duration: 30m
  accounts:
    max-per-user: 3
    default-daily-limit: 10000000   # Rp10.000.000 per day
  bootstrap:
    # Creates the first ADMIN on startup when both are set and the user does not exist yet
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
