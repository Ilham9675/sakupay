spring:
  application:
    name: sakupay
  # Connection settings come from the environment (see .env.example); the defaults match docker-compose.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sakupay}
    username: ${DB_USERNAME:sakupay}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  paths-to-match: /api/**
  # Set API_DOCS_ENABLED=false to hide Swagger UI and the OpenAPI document in production
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

sakupay:
  # Daily limits reset at midnight in this zone
  business-zone: Asia/Jakarta
  security:
    # Required, at least 32 bytes. Never commit a real value; set JWT_SECRET in the environment / .env
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    bcrypt-strength: 12
    pin-max-attempts: 5
    pin-lock-duration: 30m
  topup:
    # Shared with the partner bank, at least 32 bytes. Set TOPUP_WEBHOOK_SECRET; never commit a real value
    webhook-secret: ${TOPUP_WEBHOOK_SECRET:}
    # Webhooks older (or newer) than this are refused, so a captured request cannot be replayed later
    timestamp-tolerance: 5m
  fraud:
    # A transfer that hits any rule is held (money reserved) until an admin approves or rejects it
    large-amount: 5000000          # Rp5.000.000 or more in one transfer
    new-payee-amount: 2000000      # Rp2.000.000 or more to someone never paid before
    velocity-max-transfers: 5      # a 6th transfer within the window...
    velocity-window: 10m           # ...of 10 minutes
    night-start: "00:00"           # Rp1.000.000 or more between 00:00 and 04:00 (business zone)
    night-end: "04:00"
    night-amount: 1000000
  rate-limit:
    login-per-ip: { requests: 20, per: 1m }
    login-per-email: { requests: 10, per: 15m }
    register-per-ip: { requests: 10, per: 1h }
    transfers-per-user: { requests: 30, per: 1m }
  cors:
    # Browser front-ends allowed to call the API, comma separated (e.g. https://app.example.com). Empty = none.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  accounts:
    max-per-user: 3
    default-daily-limit: 10000000   # Rp10.000.000 per day
  bootstrap:
    # Creates the first ADMIN on startup when both are set and the user does not exist yet
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
